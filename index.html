<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#050706" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="application-name" content="The Sexual Alchemist" />
  <meta name="description" content="Save your sexual energy. Track every day, understand every slip, and keep the fire for a real connection." />
  <title>The Sexual Alchemist</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div id="splash" class="splash" aria-hidden="true">
    <img class="splash-logo" src="/icons/logo.svg" alt="" />
    <p class="splash-name">The Sexual Alchemist</p>
  </div>

  <section id="login" class="login" hidden>
    <div class="login-card card">
      <img class="splash-logo" src="/icons/logo.svg" alt="The Sexual Alchemist logo" />
      <h1>The Sexual Alchemist</h1>
      <p class="sub">Turn every day of restraint into gold. Your energy, saved for a real connection.</p>
      <button id="signIn" class="google-btn" type="button">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 36 26.7 37 24 37c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.3-.4-3.5z"/></svg>
        Continue with Google
      </button>
      <p class="fine">Your data is stored in your private cloud space and is visible only to your signed-in account.</p>
    </div>
  </section>

  <div id="app" class="app" hidden>
    <header class="topbar">
      <div class="brand">
        <img class="brand-logo" src="/icons/logo.svg" alt="" />
        <div>
          <h1>The Sexual Alchemist</h1>
          <p id="greeting" class="greet"></p>
        </div>
      </div>
      <button id="signOutBtn" class="icon-btn" type="button" aria-label="Sign out">⎋</button>
    </header>

    <main id="view" class="view"></main>

    <nav id="tabbar" class="tabbar" aria-label="Main">
      <button type="button" data-tab="today" class="active">Today</button>
      <button type="button" data-tab="calendar">Calendar</button>
      <button type="button" data-tab="insights">Insights</button>
    </nav>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modalBody">
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <script type="module" src="/js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
