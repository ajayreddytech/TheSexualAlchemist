<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#050706" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="application-name" content="The Sexual Alchemist" />
  <meta name="description" content="Save your sexual energy. Track every day, understand every slip, and keep the fire for a real connection." />
  <title>The Sexual Alchemist</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <!-- Hearth & Ember background: fixed, behind everything, decorative only. -->
  <div class="hearth" aria-hidden="true">
    <div class="hearth-base"></div>
    <div class="heat"></div>
    <div class="embers">
      <i style="--x:4%;--s:16px;--o:0.34;--sway:-10;--d:17s;--dl:0s;--f:0.24s"><b></b></i>
      <i style="--x:11%;--s:9px;--o:0.22;--sway:12;--d:21s;--dl:-6s;--f:0.3s"><b></b></i>
      <i style="--x:19%;--s:22px;--o:0.38;--sway:-8;--d:19s;--dl:-11s;--f:0.26s"><b></b></i>
      <i style="--x:27%;--s:11px;--o:0.26;--sway:14;--d:15s;--dl:-3s;--f:0.34s"><b></b></i>
      <i style="--x:35%;--s:18px;--o:0.3;--sway:-12;--d:23s;--dl:-14s;--f:0.2s"><b></b></i>
      <i style="--x:43%;--s:8px;--o:0.2;--sway:9;--d:16s;--dl:-8s;--f:0.32s"><b></b></i>
      <i style="--x:51%;--s:15px;--o:0.36;--sway:-14;--d:18s;--dl:-1s;--f:0.22s"><b></b></i>
      <i style="--x:58%;--s:20px;--o:0.4;--sway:11;--d:20s;--dl:-12s;--f:0.28s"><b></b></i>
      <i style="--x:66%;--s:10px;--o:0.24;--sway:-9;--d:14s;--dl:-5s;--f:0.36s"><b></b></i>
      <i style="--x:74%;--s:17px;--o:0.3;--sway:13;--d:22s;--dl:-16s;--f:0.24s"><b></b></i>
      <i style="--x:82%;--s:12px;--o:0.34;--sway:-11;--d:17s;--dl:-9s;--f:0.3s"><b></b></i>
      <i style="--x:90%;--s:19px;--o:0.28;--sway:10;--d:19s;--dl:-4s;--f:0.2s"><b></b></i>
      <i style="--x:96%;--s:9px;--o:0.22;--sway:-13;--d:24s;--dl:-18s;--f:0.34s"><b></b></i>
      <i style="--x:15%;--s:14px;--o:0.2;--sway:15;--d:18s;--dl:-19s;--f:0.26s"><b></b></i>
      <i style="--x:62%;--s:13px;--o:0.3;--sway:-7;--d:16s;--dl:-13s;--f:0.32s"><b></b></i>
      <i style="--x:38%;--s:21px;--o:0.25;--sway:8;--d:20s;--dl:-7s;--f:0.28s"><b></b></i>
    </div>
  </div>

  <div id="splash" class="splash" aria-hidden="true">
    <img class="splash-logo" src="/icons/logo.png" alt="" />
    <p class="splash-name">The Sexual Alchemist</p>
  </div>

  <section id="login" class="login" hidden>
    <div class="login-card card">
      <img class="splash-logo" src="/icons/logo.png" alt="The Sexual Alchemist logo" />
      <h1>The Sexual Alchemist</h1>
      <p class="sub">Turn every day of restraint into gold. Your energy, saved for a real connection.</p>
      <button id="signIn" class="google-btn" type="button">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 36 26.7 37 24 37c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.3-.4-3.5z"/></svg>
        Continue with Google
      </button>
      <p class="fine">Your data is stored in your private cloud space and is visible only to your signed-in account.</p>
    </div>
  </section>

  <div id="app" class="app" hidden>
    <header class="topbar">
      <div class="brand">
        <img class="brand-logo" src="/icons/logo.png" alt="" />
        <div>
          <h1>The Sexual Alchemist</h1>
          <p id="greeting" class="greet"></p>
        </div>
      </div>
      <button id="signOutBtn" class="icon-btn" type="button" aria-label="Sign out">⎋</button>
    </header>

    <main id="view" class="view"></main>

    <nav id="tabbar" class="tabbar" aria-label="Main">
      <button type="button" data-tab="today" class="active" aria-label="Today" title="Today"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5.3 1.8 1 2.8 2.5 3.5C11 8 11.5 5 12 2z"/></svg></span></button>
      <button type="button" data-tab="calendar" aria-label="Calendar" title="Calendar"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></span></button>
      <button type="button" data-tab="insights" aria-label="Insights" title="Insights"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg></span></button>
      <button type="button" data-tab="why" aria-label="My Why" title="My Why"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M16 8l-2.5 6.5L7 17l2.5-6.5z"/></svg></span></button>
    </nav>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modalBody">
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <script type="module" src="/js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
